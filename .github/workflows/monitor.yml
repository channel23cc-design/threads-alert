name: Threads 모니터링

on:
  workflow_dispatch:           # 수동 실행 버튼만 남김 (자동 실행 중단)

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # last_seen_id.txt 커밋 권한

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치
        run: python -m playwright install chromium --with-deps

      - name: Threads 모니터링 실행
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          THREADS_COOKIES: ${{ secrets.THREADS_COOKIES }}
        run: python monitor.py

      - name: 마지막 확인 ID 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_seen_id.txt || true
          git diff --staged --quiet || git commit -m "chore: update last seen post id"
          git push || true
